name: keep-streamlit-awake

# Mantem o app do Streamlit Community Cloud (plano gratis) fora da tela
# "Zzzz... this app has gone to sleep".
#
# ⚠️ A VERSAO ANTERIOR DESTE ARQUIVO FICAVA VERDE SEM FAZER NADA. Ela usava
# curl, e curl nao acorda Streamlit:
#   - `/_stcore/health` devolve **303** (redirect pra tela de auth). O ping
#     nunca chega no container.
#   - o GET da pagina devolve **200 ate dormindo** — sao ~9 KB de esqueleto
#     HTML, e o "Zzzz" e desenhado depois, pelo JS.
# O Streamlit conta atividade por **sessao de websocket**, e quem abre o
# websocket e o JS da pagina. Por isso agora abrimos um navegador de verdade.
#
# O trabalho esta em deploy/acordar-streamlit.py, que tambem roda na mao:
#     python deploy/acordar-streamlit.py
#
# ⚠️ O GitHub DESLIGA workflows agendados em repo sem commit ha 60 dias. Se o
# app comecar a dormir do nada, conferir isso antes de culpar o script.

on:
  schedule:
    - cron: "*/15 * * * *"   # a cada ~15 min (o agendador do GitHub atrasa 10-20 min em horario de pico)
  workflow_dispatch: {}       # rodar na mao: aba Actions -> Run workflow

concurrency:
  group: keep-alive
  cancel-in-progress: false   # acordar do zero leva ~2 min; nao cortar no meio

jobs:
  acordar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache do navegador
        id: cache-navegador
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}

      - name: Instalar Playwright
        run: |
          pip install --quiet playwright
          playwright install --with-deps chromium

      - name: Acordar o app
        run: python deploy/acordar-streamlit.py
